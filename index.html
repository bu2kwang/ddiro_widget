 <!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DDIRO 위젯</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{--bg:#ffffff;--panel:#ffffff;--ink:#1d1d1f;--sub:#6e6e73;--hi:#e23d7f;--chip:#f5f5f7;--line:rgba(0,0,0,.09);
--shadow:0 1px 2px rgba(0,0,0,.05),0 10px 28px rgba(0,0,0,.09);
--sf:-apple-system,BlinkMacSystemFont,"SF Pro Text","Apple SD Gothic Neo",Pretendard,system-ui,sans-serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#191919;--panel:#1c1c1e;--ink:#f5f5f7;--sub:#a1a1a6;--hi:#ff8fb8;--chip:#2c2c2e;--line:rgba(255,255,255,.14);--shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.45)}}
:root[data-theme="dark"]{--bg:#191919;--panel:#1c1c1e;--ink:#f5f5f7;--sub:#a1a1a6;--hi:#ff8fb8;--chip:#2c2c2e;--line:rgba(255,255,255,.14);--shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.45)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sf);display:flex;align-items:center;justify-content:center;padding:20px 28px 44px}
.win{width:100%;max-width:356px;background:var(--panel);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);overflow:hidden}
.body{padding:18px}
.scene{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:14px;margin-bottom:14px;line-height:0;cursor:pointer}
#sc{width:100%;height:auto;display:block;image-rendering:pixelated}
#cat{position:absolute;left:50%;bottom:12px;width:70px;height:60px;margin-left:-35px}
.time{font-family:"Press Start 2P",ui-monospace,monospace;font-size:24px;line-height:1.4;letter-spacing:0;text-align:center;margin:14px 0 4px;-webkit-font-smoothing:none;text-rendering:optimizeSpeed;font-kerning:none}
.time span{color:var(--hi)}
.wx{font-size:13px;color:var(--sub);text-align:center;margin:0 0 12px}
.dday{position:relative;display:flex;align-items:center;gap:8px;padding:12px 14px;background:var(--chip);border-radius:12px;font-size:13px;font-weight:600;color:var(--sub);cursor:pointer}
.dday em{font-style:normal;font-weight:500;font-size:12px}
.dday b{margin-left:auto;font-family:"Press Start 2P",monospace;font-size:14px;font-weight:400;color:var(--hi)}
.dday input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;border:0}
.dday input::-webkit-calendar-picker-indicator{position:absolute;inset:0;width:100%;height:100%;cursor:pointer}
.dday:focus-within{outline:3px solid var(--hi);outline-offset:2px}
</style>
</head>
<body>
<main class="win">
  <div class="body">
    <div class="scene" id="scene" title="배경을 누르면 날씨 미리보기가 바뀌어요">
      <canvas id="sc" width="79" height="30"></canvas>
      <svg id="cat" viewBox="0 0 14 12" shape-rendering="crispEdges" role="img" aria-label="픽셀 강아지 띠로"><rect x="1" y="0" width="2" height="3" fill="#2b2b36"/><rect x="11" y="0" width="2" height="3" fill="#2b2b36"/><rect x="1" y="2" width="12" height="6" fill="#2b2b36"/><rect x="5" y="5" width="4" height="4" fill="#fffaf0"/><rect x="6" y="7" width="2" height="1" fill="#0d0d12"/><rect x="3" y="4" width="1" height="2" fill="#8fd3ff"/><rect x="10" y="4" width="1" height="2" fill="#7a4a22"/><rect x="3" y="9" width="8" height="3" fill="#fffaf0"/></svg>
    </div>
    <p class="time" id="time">00<span>:</span>00</p>
    <p class="wx" id="wx">날씨 불러오는 중</p>
    <label class="dday" id="ddrow"><span>D-DAY</span><em id="ddl">날짜 선택</em><b id="dd">--</b><input type="date" id="target" aria-label="목표 날짜"></label>
  </div>
</main>
<script>
/* 날씨 위치(위도, 경도): 필요하면 여기를 바꾸세요. 기본값은 경기도 남양주 */
var LAT=37.65,LON=127.30;
function rnd(n){return Math.floor(Math.random()*n)}

/* ---- 날씨 배경 ---- */
var W=79,H=30,sx=document.getElementById("sc").getContext("2d"),F=0,st={k:"clear",day:true},drops=[],flakes=[];
var RM=window.matchMedia&&matchMedia("(prefers-reduced-motion:reduce)").matches;
var SKY={clear:"#cfe8ff",partly:"#cfe8ff",cloudy:"#dde3ec",rain:"#b4c2d4",snow:"#cfd9e8",thunder:"#8d98b0"};
var NSKY={clear:"#25325a",partly:"#25325a",cloudy:"#363f58",rain:"#2e3750",snow:"#3b4562",thunder:"#232a40"};
var NAME={clear:"맑음",partly:"구름 조금",cloudy:"흐림",rain:"비",snow:"눈",thunder:"천둥번개"};
var NCL={clear:0,partly:1,cloudy:3,rain:3,snow:2,thunder:3},CX=[6,38,60],CY=[3,9,5];
var MOON=["...XXXX..",".XXXXX...",".XXXX....","XXXX.....","XXXX.....","XXXX.....",".XXXX....",".XXXXX...","...XXXX.."];
function R(x,y,w,h,c){sx.fillStyle=c;sx.fillRect(Math.round(x),y,w,h)}
function cloud(x,y,c){R(x+3,y,6,1,c);R(x,y+1,12,1,c);R(x+1,y+2,10,1,c)}
function disc(cx0,cy,r,c){for(var dy=-r;dy<=r;dy++)for(var dx=-r;dx<=r;dx++)if(dx*dx+dy*dy<=r*r)R(cx0+dx,cy+dy,1,1,c)}
function moon(x,y,c){MOON.forEach(function(r,j){for(var i=0;i<9;i++)if(r[i]=="X")R(x+i,y+j,1,1,c)})}
function frame(){
  F++;var k=st.k,n=!st.day,g=H-6,sky=(n?NSKY:SKY)[k];
  R(0,0,W,H,sky);
  if(n&&(k=="clear"||k=="partly"))[[8,5],[20,11],[34,3],[50,14],[72,12],[14,18],[44,8]].forEach(function(s,i){if((F+i*3)%14<10)R(s[0],s[1],1,1,"#fff6c8")});
  if(k=="clear"||k=="partly"){if(n)moon(60,4,"#f6f1d2");else disc(62,9,5,"#ffd95a")}
  var cc=n?"#5a6482":k=="rain"?"#8d9bb0":k=="thunder"?"#606b84":"#ffffff";
  for(var i=0;i<NCL[k];i++){var x=((CX[i]+F*0.12)%(W+16))-14;if(k=="partly")x=((26+F*0.12)%(W+16))-14;cloud(x,CY[i],cc)}
  var gc=k=="snow"?(n?"#8a93a8":"#eef3f8"):(n?"#3f7a49":"#8fd17a"),gl=k=="snow"?(n?"#6c7590":"#cdd6e2"):(n?"#2f5f39":"#6fb35f");
  R(0,g,W,6,gc);R(0,g,W,1,gl);[6,19,33,48,66].forEach(function(x){R(x,g-1,1,1,gl)});
  if(k=="rain"||k=="thunder")drops.forEach(function(d){d.y+=3;d.x-=1;if(d.y>g){d.y=-3;d.x=rnd(W+8)}R(d.x,d.y,1,3,n?"#7fa6e8":"#4f86d6")});
  if(k=="snow")flakes.forEach(function(f){f.y+=1;f.x+=Math.sin((F+f.p)/6)*0.6;if(f.y>g){f.y=-1;f.x=rnd(W)}R(f.x,f.y,1,1,"#ffffff")});
  if(k=="thunder"&&F%36<2){R(0,0,W,g,"rgba(255,246,200,.55)");[[27,1,2,5],[25,6,2,5],[27,11,2,4]].forEach(function(b){R(b[0],b[1],b[2],b[3],"#ffe45c")})}
}
function kind(c){if(c<=1)return"clear";if(c==2)return"partly";if(c==3||c==45||c==48)return"cloudy";if((c>=71&&c<=77)||c==85||c==86)return"snow";if(c>=95)return"thunder";return"rain"}
function setW(k,day,temp,note){
  st={k:k,day:day};drops=[];flakes=[];
  for(var i=0;i<26;i++)drops.push({x:rnd(W+8),y:rnd(H)});
  for(var j=0;j<30;j++)flakes.push({x:rnd(W),y:rnd(H),p:rnd(60)});
  document.getElementById("wx").textContent=note||(NAME[k]+(day?"":" (밤)")+(temp!=null?" · "+temp+"°C":""));
  frame();
}
function loadW(){
  fetch("https://api.open-meteo.com/v1/forecast?latitude="+LAT+"&longitude="+LON+"&current=temperature_2m,weather_code,is_day&timezone=auto")
  .then(function(r){return r.json()}).then(function(j){var c=j.current;setW(kind(c.weather_code),!!c.is_day,Math.round(c.temperature_2m))})
  .catch(function(){var h=new Date().getHours();setW("clear",h>=6&&h<19,null,"날씨 정보 없음");setTimeout(loadW,180000)});
}
var demo=0,DEMO=[["clear",true],["partly",true],["cloudy",true],["rain",true],["snow",true],["thunder",true],["clear",false]];
document.getElementById("scene").addEventListener("click",function(){var d=DEMO[demo++%DEMO.length];setW(d[0],d[1],null)});
loadW();setInterval(loadW,20*60*1000);
setInterval(function(){if(!RM)frame()},140);

/* ---- 시계 / D-day ---- */
function p(n){return String(n).padStart(2,"0")}
function tick(){var n=new Date();
document.getElementById("time").innerHTML=p(n.getHours())+"<span>"+(n.getSeconds()%2?":":" ")+"</span>"+p(n.getMinutes());
calc()}
var t=document.getElementById("target");
try{var s=localStorage.getItem("pxTarget");if(s)t.value=s}catch(e){}
function calc(){var el=document.getElementById("dd"),l=document.getElementById("ddl");l.textContent=t.value?t.value.slice(5).replace("-","."):"날짜 선택";if(!t.value){el.textContent="--";return}
var a=new Date();a.setHours(0,0,0,0);var b=new Date(t.value+"T00:00:00");
var d=Math.round((b-a)/864e5);el.textContent=d>0?"D-"+d:d==0?"D-DAY":"D+"+(-d)}
t.addEventListener("change",function(){try{localStorage.setItem("pxTarget",t.value)}catch(e){}calc()});
document.getElementById("ddrow").addEventListener("click",function(){try{t.showPicker()}catch(e){}});
tick();setInterval(tick,1000);
</script>
</body>
</html>
